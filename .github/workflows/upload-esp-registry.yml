name: Upload ESP Component Registry

on:
  pull_request:
  push:
    branches:
      - rolling
  workflow_dispatch:

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set rolling component version
        run: |
          VERSION="27.0.0-rolling.$(date -u +%Y%m%d)"
          echo "Using component version $VERSION"
          sed -i "s/^version:.*/version: \"$VERSION\"/" idf_component.yml

      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "micro_ros_espidf_component:."
          namespace: "micro-ros"
          dry_run: ${{ github.event_name == 'pull_request' || github.ref_name != 'rolling' }}
